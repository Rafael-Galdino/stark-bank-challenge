# projectKey e organization sao passados pelo workflow (-Dsonar.projectKey / -Dsonar.organization)
# via secrets, para nao hardcodar aqui. O resto fica estatico.
sonar.sources=src
sonar.tests=tests
sonar.exclusions=dist/**,node_modules/**,coverage/**
sonar.test.inclusions=tests/**/*.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
